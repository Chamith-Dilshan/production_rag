[project]
name = "production-rag"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.126.0",
    "docling-core[chunking-openai]>=2.94.1",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-docling>=3.0.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.12.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.6",
    "pyrefly>=1.2.0",
]

[tool.coverage.run]
source = ["app"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
python_version = "3.14"
strict = true
